<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}</style>
<title>Peonies for Sabrina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Jost:wght@400&display=swap">
<style>
  /* Layout: one evening-dark screen; the note floats at the top, a peony bouquet blooms beneath it. */
  :root {
    --night: #1a0812;
    --night-deep: #0e040a;
    --wine: #3a1427;
    --ink: #fdf0f4;
    --blush: #f5adc3;
    --muted: rgba(253, 240, 244, 0.62);
    --font-script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
    --font-serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --font-label: "Jost", "Avenir Next", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 70%, var(--wine) 0%, var(--night) 55%, var(--night-deep) 100%) fixed, var(--night);
    color: var(--ink);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #stage { cursor: pointer; }
  .note {
    position: relative;
    z-index: 2;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.2rem;
    padding-block: clamp(1.75rem, 6vh, 4rem) 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .eyebrow {
    font-family: var(--font-label);
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--blush);
    margin: 0 0 0.6rem;
  }
  .to {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: clamp(1.4rem, 4.2vw, 2rem);
    margin: 0;
    color: var(--muted);
  }
  h1 {
    font-family: var(--font-script);
    font-weight: 400;
    font-size: clamp(4rem, 15vw, 7.5rem);
    line-height: 1;
    margin: 0;
    padding-inline: 0.3em;
    text-wrap: balance;
    color: var(--ink);
    text-shadow: 0 0 28px rgba(245, 173, 195, 0.35);
    animation: rise 2.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .love {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.5rem, 4.6vw, 2.2rem);
    margin: 0.2rem 0 0;
    color: var(--blush);
  }
  .hint {
    position: fixed;
    z-index: 2;
    left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-family: var(--font-label);
    font-size: 0.68rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @keyframes rise {
    from { transform: translateY(10px); letter-spacing: -0.02em; }
    to { transform: none; letter-spacing: 0; }
  }
  @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
</style>

<canvas id="stage" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true" style="pointer-events:none"></canvas>

<main class="note">
  <p class="eyebrow">White &amp; pink peonies</p>
  <p class="to">To my girl,</p>
  <h1>Sabrina</h1>
  <p class="love">I love you.</p>
</main>
<p class="hint">Tap the flowers for more petals</p>

<script>
(() => {
  const stage = document.getElementById('stage');
  const fx = document.getElementById('fx');
  const sctx = stage.getContext('2d');
  const fctx = fx.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Peony palettes: base of petal -> tip of petal, plus an edge line.
  const PAL = {
    white: { base: '#ecd6dc', mid: '#faf1f3', tip: '#ffffff', edge: 'rgba(190,140,155,0.35)', heart: '#f3dcc0' },
    pink:  { base: '#c9426f', mid: '#e8789b', tip: '#f9bfd0', edge: 'rgba(120,20,60,0.35)', heart: '#b8325f' },
    blush: { base: '#e48aa6', mid: '#f4b8c9', tip: '#fde6ec', edge: 'rgba(160,60,95,0.3)', heart: '#dc7f9c' }
  };

  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => 1 - Math.pow(1 - t, 3);

  let W = 0, H = 0, DPR = 1, S = 0, CX = 0, CY = 0;
  let flowers = [], leaves = [], start = performance.now(), cache = null;

  function petalPath(ctx, len, wid, ruf) {
    const n = ruf.length;
    const edgeY = x => len * (0.84 + 0.16 * (1 - 4 * x * x));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-wid * 0.3, len * 0.18, -wid * 0.78, len * 0.5, -wid * 0.5, edgeY(-0.5));
    for (let i = 0; i < n; i++) {
      const x0 = -0.5 + i / n, x1 = -0.5 + (i + 1) / n, cx = (x0 + x1) / 2;
      ctx.quadraticCurveTo(cx * wid, edgeY(cx) + len * ruf[i], x1 * wid, edgeY(x1) - len * 0.02);
    }
    ctx.bezierCurveTo(wid * 0.78, len * 0.5, wid * 0.3, len * 0.18, 0, 0);
    ctx.closePath();
  }

  function drawPetal(ctx, len, wid, ruf, pal, depth) {
    petalPath(ctx, len, wid, ruf);
    const g = ctx.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, pal.base);
    g.addColorStop(0.55 - depth * 0.2, pal.mid);
    g.addColorStop(1, pal.tip);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(0.6, len * 0.012);
    ctx.strokeStyle = pal.edge;
    ctx.stroke();
    // a soft vein down the middle
    ctx.beginPath();
    ctx.moveTo(0, len * 0.12);
    ctx.quadraticCurveTo(wid * 0.05, len * 0.5, 0, len * 0.78);
    ctx.strokeStyle = pal.edge;
    ctx.globalAlpha *= 0.5;
    ctx.stroke();
    ctx.globalAlpha /= 0.5;
  }

  function makePeony(x, y, r, kind, delay, seed, budOnly) {
    const rand = rng(seed);
    const petals = [];
    const rings = 6;
    for (let k = 0; k < rings; k++) {
      const t = k / (rings - 1);
      const n = Math.round(10 - t * 4 + rand() * 2);
      const off = rand() * Math.PI * 2;
      for (let i = 0; i < n; i++) {
        const len = r * (1 - t * 0.68) * (0.9 + rand() * 0.18);
        const ruf = Array.from({ length: 3 + Math.floor(rand() * 3) }, () => 0.04 + rand() * 0.09);
        petals.push({
          a: off + (i / n) * Math.PI * 2 + (rand() - 0.5) * 0.35,
          len, wid: len * (0.8 + rand() * 0.35), ruf,
          lift: t, d: t * 0.55 + rand() * 0.15
        });
      }
    }
    // dense ruffled heart
    for (let i = 0; i < 18; i++) {
      const len = r * (0.12 + rand() * 0.16);
      petals.push({
        a: rand() * Math.PI * 2, len, wid: len * (1 + rand() * 0.5),
        ruf: [0.08, 0.12, 0.06, 0.1].map(v => v * (0.6 + rand())), lift: 1.1, d: 0.75 + rand() * 0.2, heart: true
      });
    }
    return { x, y, r, pal: PAL[kind], delay, petals, budOnly, tilt: (rand() - 0.5) * 0.3 };
  }

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [stage, fx]) { c.width = W * DPR; c.height = H * DPR; }
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W * 0.92, H * 0.74);
    CX = W / 2; CY = H * 0.66;

    const spec = [
      [-0.40, -0.17, 0.10, 'white', 0.9],
      [ 0.41, -0.16, 0.105, 'white', 1.1],
      [-0.13, -0.24, 0.135, 'blush', 0.5],
      [ 0.14, -0.23, 0.14, 'pink', 0.3],
      [-0.27,  0.03, 0.155, 'pink', 0.7],
      [ 0.27,  0.02, 0.16, 'blush', 0.6],
      [ 0.00, -0.06, 0.185, 'white', 0.0],
      [-0.08,  0.19, 0.14, 'white', 0.8],
      [ 0.12,  0.20, 0.13, 'pink', 1.0]
    ];
    const buds = [[-0.47, -0.36, 0.06, 'pink'], [0.49, -0.34, 0.055, 'blush'], [0.02, -0.42, 0.05, 'white']];
    flowers = [];
    spec.forEach((f, i) => flowers.push(makePeony(CX + f[0] * S, CY + f[1] * S, f[2] * S, f[3], f[4], 101 + i * 17, false)));
    buds.forEach((b, i) => flowers.push(makePeony(CX + b[0] * S, CY + b[1] * S, b[2] * S, b[3], 1.4, 900 + i * 7, true)));
    flowers.sort((a, b) => a.y - b.y);

    const rand = rng(77);
    leaves = Array.from({ length: 14 }, (_, i) => {
      const a = -Math.PI * 0.95 + (i / 13) * Math.PI * 0.9 + (rand() - 0.5) * 0.15;
      return { a: a, len: S * (0.2 + rand() * 0.1), wid: S * (0.06 + rand() * 0.02), dist: S * (0.2 + rand() * 0.1) };
    });
    cache = null;
  }

  function drawStems(ctx, grow) {
    const bx = CX, by = CY + S * 0.5;
    ctx.lineCap = 'round';
    for (const f of flowers) {
      ctx.beginPath();
      ctx.moveTo(bx + (f.x - CX) * 0.08, H + 40);
      ctx.quadraticCurveTo(bx + (f.x - CX) * 0.15, by, f.x, f.y);
      ctx.strokeStyle = '#3f6a3a';
      ctx.lineWidth = Math.max(2, S * 0.008);
      ctx.globalAlpha = grow;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawLeaves(ctx, grow) {
    for (const l of leaves) {
      const x = CX + Math.cos(l.a) * l.dist, y = CY + Math.sin(l.a) * l.dist * 0.75 + S * 0.05;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(l.a - Math.PI / 2);
      const len = l.len * (0.4 + 0.6 * grow);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-l.wid, len * 0.3, -l.wid * 0.6, len * 0.8, 0, len);
      ctx.bezierCurveTo(l.wid * 0.6, len * 0.8, l.wid, len * 0.3, 0, 0);
      const g = ctx.createLinearGradient(0, 0, 0, len);
      g.addColorStop(0, '#24442a');
      g.addColorStop(1, '#5c8f4f');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, len * 0.05); ctx.lineTo(0, len * 0.92);
      ctx.strokeStyle = 'rgba(190,220,170,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawRibbon(ctx) {
    const x = CX, y = CY + S * 0.47;
    if (y > H - 10) return;
    const s = S * 0.06;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#f2a3bb';
    ctx.strokeStyle = 'rgba(120,20,60,0.35)';
    ctx.lineWidth = 1;
    // band around the stems
    ctx.fillRect(-s * 0.9, -s * 0.28, s * 1.8, s * 0.56);
    for (const dir of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(dir * s * 1.6, -s * 1.3, dir * s * 2.1, s * 0.5, 0, 0);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(dir * s * 0.5, s * 1.2, dir * s * 1.1, s * 2.3);
      ctx.lineTo(dir * s * 0.7, s * 2.1);
      ctx.quadraticCurveTo(dir * s * 0.25, s * 1.1, 0, 0);
      ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, s * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = '#e07a9a'; ctx.fill();
    ctx.restore();
  }

  function drawPeony(ctx, f, T) {
    const fo = f.budOnly ? 0.1 : ease(clamp((T - f.delay) / 3.2, 0, 1));
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.tilt);
    // soft shadow beneath the bloom
    const sh = ctx.createRadialGradient(0, f.r * 0.15, 0, 0, f.r * 0.15, f.r * 1.2);
    sh.addColorStop(0, 'rgba(10,2,6,0.45)');
    sh.addColorStop(1, 'rgba(10,2,6,0)');
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.arc(0, f.r * 0.15, f.r * 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.scale(1, 0.84);
    for (const p of f.petals) {
      const o = f.budOnly ? 0.1 : ease(clamp((fo * 1.6 - p.d) / 0.9, 0, 1));
      const grow = 0.22 + 0.78 * o;
      ctx.save();
      ctx.translate(0, -p.lift * f.r * 0.16);
      ctx.rotate(p.a + (1 - o) * 0.4);
      const depth = p.heart ? 0.6 : p.lift * 0.5;
      ctx.globalAlpha = 0.25 + 0.75 * Math.max(o, f.budOnly ? 1 : 0.35);
      drawPetal(ctx, p.len * grow, p.wid * (0.55 + 0.45 * o), p.ruf, p.heart ? { ...f.pal, base: f.pal.heart } : f.pal, depth);
      ctx.restore();
    }
    ctx.restore();
  }

  function renderBouquet(ctx, T) {
    ctx.clearRect(0, 0, W, H);
    const grow = ease(clamp(T / 1.6, 0, 1));
    drawStems(ctx, grow);
    drawLeaves(ctx, grow);
    drawRibbon(ctx);
    for (const f of flowers) drawPeony(ctx, f, T - 0.6);
  }

  // Drifting petals
  const drift = [];
  const kinds = [PAL.white, PAL.pink, PAL.blush];
  function spawn(x, y, burst) {
    const k = kinds[Math.floor(Math.random() * kinds.length)];
    const sz = (burst ? 10 : 8) + Math.random() * 12;
    drift.push({
      x, y, pal: k, len: sz, wid: sz * 0.9, ruf: [0.06, 0.1, 0.07],
      vx: burst ? (Math.random() - 0.5) * 4 : (Math.random() - 0.5) * 0.4,
      vy: burst ? -Math.random() * 3.5 - 1 : 0.4 + Math.random() * 0.6,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.05,
      ph: Math.random() * 6, life: 0
    });
  }

  let lastAmbient = 0;
  function tick(now) {
    const T = reduce ? 99 : (now - start) / 1000;
    const done = T > 7;
    if (done && !cache) {
      cache = document.createElement('canvas');
      cache.width = W * DPR; cache.height = H * DPR;
      const c = cache.getContext('2d');
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      renderBouquet(c, 99);
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, stage.width, stage.height);
      sctx.drawImage(cache, 0, 0);
      sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    } else if (!cache) {
      renderBouquet(sctx, T);
    }

    if (!reduce && now - lastAmbient > 650 && drift.length < 60) {
      spawn(Math.random() * W, -20, false);
      lastAmbient = now;
    }
    fctx.clearRect(0, 0, W, H);
    for (let i = drift.length - 1; i >= 0; i--) {
      const p = drift[i];
      p.life++;
      p.vy = Math.min(p.vy + 0.035, 1.3);
      p.vx *= 0.985;
      p.x += p.vx + Math.sin(p.life * 0.03 + p.ph) * 0.6;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > H + 30) { drift.splice(i, 1); continue; }
      fctx.save();
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.scale(1, 0.6 + 0.4 * Math.abs(Math.sin(p.life * 0.04 + p.ph)));
      fctx.globalAlpha = 0.9;
      drawPetal(fctx, p.len, p.wid, p.ruf, p.pal, 0.2);
      fctx.restore();
    }
    requestAnimationFrame(tick);
  }

  stage.addEventListener('pointerdown', e => {
    for (let i = 0; i < 22; i++) spawn(e.clientX, e.clientY, true);
  });
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

  layout();
  if (reduce) for (let i = 0; i < 18; i++) spawn(Math.random() * W, Math.random() * H, false);
  requestAnimationFrame(tick);
})();
</script>
</body></html>
